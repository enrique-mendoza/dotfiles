# ----------------------------------------------------
# Terminal
# ----------------------------------------------------
set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",*:RGB"
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"
set -s escape-time 10
set -g set-titles on
set -g set-titles-string "#h:#W"

# ----------------------------------------------------
# Mouse
# ----------------------------------------------------
set -g mouse on

# ----------------------------------------------------
# Vi Mode
# ----------------------------------------------------
setw -g mode-keys vi

# ----------------------------------------------------
# Windows & Panes
# ----------------------------------------------------
set -g base-index 1
set -g pane-base-index 1
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"
set -g renumber-windows on
set -g pane-border-lines simple

# ----------------------------------------------------
# Key Repeat
# ----------------------------------------------------
set -g repeat-time 600

# ----------------------------------------------------
# Prefix
# ----------------------------------------------------
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# ----------------------------------------------------
# Reload Config
# ----------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ----------------------------------------------------
# Pane Navigation
# ----------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ----------------------------------------------------
# Pane Swapping
# ----------------------------------------------------
bind -r "{" swap-pane -U
bind -r "}" swap-pane -D

# ----------------------------------------------------
# Pane Resizing
# ----------------------------------------------------
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# ----------------------------------------------------
# Maximize Pane
# ----------------------------------------------------
bind -r m resize-pane -Z

# ----------------------------------------------------
# Splits
# ----------------------------------------------------
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# ----------------------------------------------------
# Window & Session Picker
# ----------------------------------------------------
bind ";" run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/window.sh switch"
bind K run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh switch"

# ----------------------------------------------------
# Copy Mode
# ----------------------------------------------------
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

unbind -T copy-mode-vi MouseDragEnd1Pane

# ----------------------------------------------------
# Popups
# ----------------------------------------------------
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"

# ----------------------------------------------------
# Plugins
# ----------------------------------------------------
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "sainnhe/tmux-fzf"
set -g @plugin "schasse/tmux-jump"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-prefix-highlight"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"

# ----------------------------------------------------
# Plugin Settings
# ----------------------------------------------------
set -g @continuum-restore "on"

# https://github.com/sainnhe/tmux-fzf/issues/78
setenv -g TMUX_FZF_SWITCH_CURRENT "1"

# ----------------------------------------------------
# Status Line Palette (Mocha)
# ----------------------------------------------------
thm_mocha_bg="#1e1e2e"
thm_mocha_fg="#cdd6f4"
thm_mocha_green="#a6e3a1"
thm_mocha_teal="#94e2d5"
thm_mocha_peach="#fab387"
thm_mocha_yellow="#f9e2af"
thm_mocha_sapphire="#74c7ec"
thm_mocha_blue="#89b4fa"
thm_mocha_lavender="#b4befe"
thm_mocha_overlay_0="#6c7086"
thm_mocha_surface_2="#585b70"

# ----------------------------------------------------
# Status Line Palette (Latte accents)
# ----------------------------------------------------
thm_latte_bg="#eff1f5"
thm_latte_peach="#fe640b"
thm_latte_overlay_2="#7c7f93"
thm_latte_overlay_1="#8c8fa1"
thm_latte_overlay_0="#9ca0b0"

# ----------------------------------------------------
# Status Line Chrome
# ----------------------------------------------------
set -g mode-style "fg=${thm_mocha_yellow},bg=${thm_mocha_bg}"

set -g message-style "fg=${thm_mocha_teal},bg=${thm_mocha_bg},align=centre"
set -g message-command-style "fg=${thm_mocha_teal},bg=${thm_mocha_bg},align=centre"

set -g pane-border-style "fg=${thm_mocha_overlay_0}"
set -g pane-active-border-style "fg=${thm_mocha_lavender}"

# ----------------------------------------------------
# Status Line Core
# ----------------------------------------------------
set -g status "on"
set -g status-interval 1
set -g status-justify "left"
set -g status-position bottom

set -g status-style "fg=${thm_mocha_fg},bg=${thm_mocha_bg}"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

# ----------------------------------------------------
# Status Line Content
# ----------------------------------------------------
set -g status-left "#[fg=${thm_mocha_bg},bg=${thm_latte_bg},bold] #S:#I.#P #[fg=${thm_latte_bg},bg=${thm_latte_overlay_0},nobold,nounderscore,noitalics]#[fg=${thm_mocha_bg},bg=${thm_latte_overlay_0},bold] #{pane_current_command} #[fg=${thm_latte_overlay_0},bg=${thm_mocha_bg}]"
set -g status-right "#[fg=${thm_latte_overlay_2},bg=${thm_mocha_bg},nobold,nounderscore,noitalics]#[fg=${thm_latte_overlay_0},bg=${thm_latte_overlay_2}]#[fg=${thm_latte_overlay_1},bg=${thm_latte_overlay_2},nobold,nounderscore,noitalics]#[fg=${thm_latte_overlay_0},bg=${thm_latte_overlay_1}]#[fg=${thm_latte_overlay_0},bg=${thm_latte_overlay_1},nobold,nounderscore,noitalics]#[fg=${thm_mocha_bg},bg=${thm_latte_overlay_0},bold] #(uptime | sed 's/^[^,]*up *//; s/, *[[:digit:]]* user.*//; s/ day.*, */d /; s/ hr\\(s*\\).*/h/; s/ min\\(s*\\).*/m/; s/ sec\\(s*\\).*/s/; s/\\([0-9]\\{1,2\\}\\):\\([0-9]\\{1,2\\}\\)/\\1h \\2m/;') "

# ----------------------------------------------------
# Window Status Format
# ----------------------------------------------------
setw -g window-status-activity-style "underscore,fg=${thm_mocha_surface_2},bg=${thm_mocha_bg}"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=${thm_mocha_surface_2},bg=${thm_mocha_bg}"
setw -g window-status-format "#[fg=${thm_mocha_bg},bg=${thm_mocha_bg}]#[default] #I  #W #[fg=${thm_mocha_bg},bg=${thm_mocha_bg},nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=${thm_mocha_bg},bg=${thm_latte_bg}]#[fg=${thm_latte_peach},bg=${thm_latte_bg}] #I #[fg=${thm_latte_bg},bg=${thm_latte_peach}] #(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=${thm_latte_peach},bg=${thm_mocha_bg},nobold]"

# ----------------------------------------------------
# Pane Number Display
# ----------------------------------------------------
set -g display-panes-active-colour "${thm_mocha_blue}"
set -g display-panes-colour "${thm_mocha_peach}"

# ----------------------------------------------------
# Clock Mode
# ----------------------------------------------------
setw -g clock-mode-colour "${thm_mocha_green}"

# ----------------------------------------------------
# Plugin Manager
# ----------------------------------------------------
# Must load last for TPM Redux to work correctly.
run "~/.tmux/plugins/tpm-redux/tpm"
