# ----------------------------------------------------
# Terminal
# ----------------------------------------------------
set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",*:RGB"
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"
set -s escape-time 10
set -g set-titles on
set -g set-titles-string "#h:#W"

# ----------------------------------------------------
# Mouse
# ----------------------------------------------------
set -g mouse on

# ----------------------------------------------------
# Vi Mode
# ----------------------------------------------------
setw -g mode-keys vi

# ----------------------------------------------------
# Windows & Panes
# ----------------------------------------------------
set -g base-index 1
set -g pane-base-index 1
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"
set -g renumber-windows on
set -g pane-border-lines simple

# ----------------------------------------------------
# Key Repeat
# ----------------------------------------------------
set -g repeat-time 600

# ----------------------------------------------------
# Prefix
# ----------------------------------------------------
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# ----------------------------------------------------
# Reload Config
# ----------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ----------------------------------------------------
# Pane Navigation
# ----------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ----------------------------------------------------
# Pane Swapping
# ----------------------------------------------------
bind -r "{" swap-pane -U
bind -r "}" swap-pane -D

# ----------------------------------------------------
# Pane Resizing
# ----------------------------------------------------
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# ----------------------------------------------------
# Maximize Pane
# ----------------------------------------------------
bind -r m resize-pane -Z

# ----------------------------------------------------
# Splits
# ----------------------------------------------------
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# ----------------------------------------------------
# Scratch Session
# ----------------------------------------------------
bind -n M-s if-shell -F '#{==:#{session_name},scratch}' \
  "detach-client" \
  "display-popup -d '#{pane_current_path}' -E \"tmux new-session -A -s scratch\""

# ----------------------------------------------------
# Window & Session Picker
# ----------------------------------------------------
bind -r ";" run-shell -b "tmux neww tmux-sessionizer"

bind -r N run-shell -b "tmux-sessionizer ~/"
bind -r O run-shell -b "tmux-sessionizer ~/dotfiles"
bind -r R run-shell -b "tmux-sessionizer ~/.config"

# ----------------------------------------------------
# Copy Mode
# ----------------------------------------------------
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

unbind -T copy-mode-vi MouseDragEnd1Pane

# ----------------------------------------------------
# Popups
# ----------------------------------------------------
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"

# ----------------------------------------------------
# Password Manager
# ----------------------------------------------------
bind P run-shell -b "tmux neww passfzf"

# ----------------------------------------------------
# Plugins
# ----------------------------------------------------
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-prefix-highlight"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"

set -g @plugin "catppuccin/tmux#v2.3.0"
set -g @plugin "christoomey/vim-tmux-navigator"

# ----------------------------------------------------
# Plugin Settings
# ----------------------------------------------------
set -g @continuum-save-interval "10"
set -g @continuum-restore "on"

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev)"

# ----------------------------------------------------
# Status Line Core
# ----------------------------------------------------
set -g status-position top

set -g status-left-length 100
set -g status-right-length 100

# ----------------------------------------------------
# Status Line Content
# ----------------------------------------------------
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# ----------------------------------------------------
# Plugin Manager
# ----------------------------------------------------
# Must load last for TPM to work correctly.
run "~/.tmux/plugins/tpm/tpm"
