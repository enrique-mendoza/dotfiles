# ----------------------------------------------------
# Terminal
# ----------------------------------------------------
set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",*:RGB"
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"
set -s escape-time 10

# ----------------------------------------------------
# Mouse
# ----------------------------------------------------
set -g mouse on

# ----------------------------------------------------
# Vi Mode
# ----------------------------------------------------
setw -g mode-keys vi

# ----------------------------------------------------
# Windows & Panes
# ----------------------------------------------------
set -g base-index 1
set -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on
set -g pane-border-lines simple

# ----------------------------------------------------
# Status Bar
# ----------------------------------------------------
set -g status-position bottom

# ----------------------------------------------------
# Key Repeat
# ----------------------------------------------------
set -g repeat-time 600

# ----------------------------------------------------
# Prefix
# ----------------------------------------------------
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# ----------------------------------------------------
# Reload Config
# ----------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ----------------------------------------------------
# Pane Navigation
# ----------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ----------------------------------------------------
# Pane Swapping
# ----------------------------------------------------
bind -r "{" swap-pane -U
bind -r "}" swap-pane -D

# ----------------------------------------------------
# Pane Resizing
# ----------------------------------------------------
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# ----------------------------------------------------
# Maximize Pane
# ----------------------------------------------------
bind -r m resize-pane -Z

# ----------------------------------------------------
# Splits
# ----------------------------------------------------
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# ----------------------------------------------------
# Window & Session Picker
# ----------------------------------------------------
bind W choose-window
bind S choose-session

bind w run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/window.sh switch"
bind s run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh switch"

# ----------------------------------------------------
# Copy Mode
# ----------------------------------------------------
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

unbind -T copy-mode-vi MouseDragEnd1Pane

# ----------------------------------------------------
# Popups
# ----------------------------------------------------
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# ----------------------------------------------------
# Plugins
# ----------------------------------------------------
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-prefix-highlight"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "sainnhe/tmux-fzf"
set -g @plugin "christoomey/vim-tmux-navigator"

# ----------------------------------------------------
# Plugin Settings
# ----------------------------------------------------
set -g @continuum-restore "on"

# https://github.com/sainnhe/tmux-fzf/issues/78
setenv -g TMUX_FZF_SWITCH_CURRENT "1"

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# ----------------------------------------------------
# Status Line
# ----------------------------------------------------
# https://github.com/catppuccin/tmux/blob/main/docs/reference/configuration.md
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# ----------------------------------------------------
# Plugin Manager
# ----------------------------------------------------
# Must load last for TPM to work correctly.
run "~/.tmux/plugins/tpm/tpm"
